<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="canonical" href="https://getbootstrap.com/docs/5.2/examples/checkout/">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

</head>
<body>
    <main>
        <h2>Formulario <span class="badge text-bg-secondary">New</span></h2>
        <form id="productForm" class="needs-validation" novalidate>
    <div class="col-md-8 order-md-1">
        <h4 class="mb-3">Agregar Productos</h4>
        <div class="alert alert-danger fade show" style="display:none;"
                                           role="alert" id="alertValidaciones">
             <p id="alertValidacionesTexto"></p>
       </div>
        <form class="needs-validation" novalidate>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="Name">Nombre del Producto</label>
              <input type="text" class="form-control" id="Name" autofocus placeholder="" value="" autocomplete="off" required>
              <div class="invalid-feedback">
                Nombre inválido
              </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="description">Descripccion del Producto</label>
                  <input type="text" class="form-control" id="description" autofocus placeholder="" value="" autocomplete="off" required>
                  <div class="invalid-feedback">
                    Descripccion inválido
                  </div>
                </div>
              <div class="input-group mb-3">
                  <label class="input-group-text" for="inputGroupFile01" autofocus placeholder="" value="">Imagen del Producto</label>
                  <input type="file" class="form-control" id="image">
                  <div class="invalid-feedback">
                    Link inválido
                  </div>
                </div>
          </div>
          <button id="btnAgregar" class="btn btn-primary btn-lg btn-block" type="button">Agregar</button>
          <button id="btnClear" class="btn btn-secondary btn-lg btn-block" type="button">Limpiar</button>
          <hr class="mb-4">
          </form>
        </main>
    <script src="./Forulario.js"></script>
    <script src="../CSS_El/head.js"></script>
</body>
</html>
