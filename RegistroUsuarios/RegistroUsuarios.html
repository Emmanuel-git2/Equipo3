<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
        <link rel="stylesheet" href="./estiloRegistro/estiloRegistro.css"> <!-- Enlace a la hoja de estilos registro usuarios -->
    <title>Registro Usuarios</title>
</head>

<body>
    <div class="container">
        <form>
            <h2>Regístrate</h2>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="name">Nombre completo</label>
                    <input type="text" class="form-control" id="name" placeholder="Escribe tu nombre">
                </div>
                <div class="form-group col-md-6">
                    <label for="userName">Nombre de usuario</label>
                    <input type="text" class="form-control" id="userName" placeholder="Escribe tu nombre de usuario">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="numberPhone">Número de teléfono</label>
                    <input type="tel" class="form-control" id="numberPhone" placeholder="10 dígitos">
                </div>
                <div class="form-group col-md-6">
                    <label for="postCode">Código postal</label>
                    <input type="number" class="form-control" id="postCode" placeholder="5 dígitos">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="email">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com">
                </div>
                <div class="form-group col-md-6">
                    <label for="emailConfirm">Confirma tu correo</label>
                    <input type="email" class="form-control" id="emailConfirm" placeholder="name@example.com">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="password">Crea una contraseña</label>
                    <input type="password" class="form-control" id="password" placeholder="********">
                </div>
                <div class="form-group col-md-6">
                    <label for="passwordConfirm">Confirma tu contraseña</label>
                    <input type="password" class="form-control" id="passwordConfirm" placeholder="********">
                </div>
            </div>
            <div class="form-group">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="gridCheck">
                    <label class="form-check-label" for="gridCheck">
                        Acepto términos y condiciones
                    </label>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Registrar</button>
        </form>
    </div>
    <script src="../Header_y_footer/header_y_footer.js"></script>
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
        integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
        integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
        crossorigin="anonymous"></script>
</body>

</html>
