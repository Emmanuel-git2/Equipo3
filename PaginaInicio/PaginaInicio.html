<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrickMania</title>
    <!-- Horizon y Montserrat Classic -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./PaginaInicio.css">
</head>
<body>
  <!--Titulo-->
  <div class="card text">
    <img src="./imagenes/Inspirational Gradient Desktop Background.png" class="card-img" alt="Fondo Azul" height="210px">
    <div class="card-img-overlay">
      <h5 class="card-title" id="TituloUno">Brick<span id="TituloDos">Mania</span></h5>
      <p class="card-text" id="Eslogan">Construye tu creatividad</p>
      <button type="button" class="btn btn-primary">Entrar</button><span> </span><button type="button" class="btn btn-dark">Registrar</button>
    </div>
  </div>
    <!--Carrusel-->
    <div id="carouselExampleIndicators" class="carousel slide">
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
          </div>
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="./imagenes/BrickClub_group_of_kids.jpg" class="d-block w-100" alt="Club de bloques">
            </div>
            <div class="carousel-item">
              <img src="./imagenes/rick-mason-2FaCKyEEtis-unsplash.avif"class="d-block w-100" alt="Jugando">
            </div>
            <div class="carousel-item">
              <img src="./imagenes/ImagenBloques.png" class="d-block w-100" alt="Imagen Bloques">
            </div>
          </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
    <!--Mas-->
 <main>
    <p class="quienS">Quienes Somos</p>
    <p>Somos tu tienda online preferida, donde encontrarás todo tipo de bloques de construccion. 
      Ponemos a tu alcance todos los diseños que no has podido encontrar, desde los más comunes 
      hasta ediciones especiales. </p>
      
      <div class="container-fluid mt-5">
        <h2>Productos Disponibles</h2>
        
        <div class="container-fluid">
          <div class="row" id="list-items">
              <!-- Las tarjetas se insertarán aquí -->
          </div>
      </div>
      
    </div>
   </main>
 
    <!-- <script src="head.js"></script> -->
    <script src="../Header_y_footer/header_y_footer.js"></script>
    <script src="FuncionProductos.js"></script>
</body>
</html>
