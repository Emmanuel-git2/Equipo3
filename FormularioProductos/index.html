<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Producto</title>
    <!-- Enlace a Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="formulario.css">
</head>

<body>
    <div class="container mt-5">
        <h2>Agregar Nuevo Producto</h2>
        
        <!-- Alertas para mostrar errores -->
        <div id="alert" class="alert alert-danger d-none" role="alert">
            <p id="alertText"></p>
        </div>
        
        <!-- Formulario de creación de producto -->
        <form id="productForm">
            <div class="mb-3">
                <label for="productName" class="form-label">Nombre del Producto</label>
                <input type="text" class="form-control" id="productName" required>
                <div class="invalid-feedback">
                    El nombre del producto es obligatorio.
                </div>
            </div>
            
            <div class="mb-3">
                <label for="productDescription" class="form-label">Descripción</label>
                <textarea class="form-control" id="productDescription" rows="3" required></textarea>
                <div class="invalid-feedback">
                    La descripción del producto es obligatoria.
                </div>
            </div>
            
            <div class="mb-3">
                <label for="productPrice" class="form-label">Precio</label>
                <input type="number" class="form-control" id="productPrice" required>
                <div class="invalid-feedback">
                    El precio es obligatorio y debe ser un número válido.
                </div>
            </div>
            
            <div class="mb-3">
                <label for="productImage" class="form-label">URL de la Imagen</label>
                <input type="url" class="form-control" id="productImage" required>
                <div class="invalid-feedback">
                    La URL de la imagen es obligatoria y debe ser válida.
                </div>
            </div>
            
            <!-- Botón para cargar imagen -->
            <button type="button" class="btn btn-secondary" id="uploadBtn">Subir Imagen</button>

            <!-- Mostrar la URL de la imagen subida -->
            <div class="mt-3">
                <p id="imagePreview">Imagen seleccionada: <span id="imageUrl"></span></p>
            </div>

            <button type="button" class="btn btn-primary" id="submitBtn">Agregar Producto</button>
        </form>
    </div>

    <!-- Script de Cloudinary -->
    <script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>

    <!-- Script JS para validación y manejo de datos -->
    <script>
        // Función para subir imagen a Cloudinary
        document.getElementById('uploadBtn').addEventListener('click', function () {
            cloudinary.openUploadWidget(
                {
                    cloudName: 'dy6sopjv3',  // Reemplaza con tu Cloud Name
                    uploadPreset:'uw_formulario', // Reemplaza con tu Upload Preset
                    sources: ['local', 'url', 'camera'],
                    multiple: false,
                    showAdvancedOptions: false,
                    cropping: true,
                    maxFileSize: 2000000, // Limitar tamaño de archivo a 2MB
                },
                function (error, result) {
                    if (error) {
                        console.error('Error al subir la imagen:', error);
                        alert('Error al subir la imagen: ' + error.message);
                    } else if (result && result.event === "success") {
                        const imageUrl = result.info.secure_url;
                        const productImageField = document.getElementById("productImage");

                        if (productImageField) {
                            productImageField.value = imageUrl; // Asignar URL al campo del formulario
                            document.getElementById("imageUrl").textContent = imageUrl; // Mostrar la URL
                            console.log("Imagen subida exitosamente:", imageUrl);
                        } else {
                            console.error("No se encontró el campo de imagen.");
                        }
                    }
                }
            );
        });

        // Validación y creación de objeto JSON al enviar el formulario
        document.getElementById('submitBtn').addEventListener('click', function () {
            const form = document.getElementById('productForm');
            if (form.checkValidity() === false) {
                form.classList.add('was-validated');
                document.getElementById('alertText').textContent = "Por favor, complete todos los campos.";
                document.getElementById('alert').classList.remove('d-none');
            } else {
                const productData = {
                    name: document.getElementById('productName').value,
                    description: document.getElementById('productDescription').value,
                    price: parseFloat(document.getElementById('productPrice').value),
                    image: document.getElementById('productImage').value
                };

                console.log('Producto creado:', productData);

                // Simulación de enviar al servidor
                alert("Producto agregado con éxito");

                // Limpiar formulario
                form.reset();
                form.classList.remove('was-validated');
                document.getElementById('alert').classList.add('d-none'); // Ocultar alerta
            }
        });
    </script>

</body>

</html>
