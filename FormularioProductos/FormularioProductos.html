<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Producto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="formulario.css">
    <link rel="stylesheet" href="../Header_y_footer/header_y_footer.css">
</head>
<body>

    <div class="titulo2">
        <div class="container-fluid">
            <div class="row justify-content-center">
                <div class="col-12 text-center">
                    <h1><span id="letraB">Brick</span><span id="letraM">Manía</span></h1>
                </div>
            </div>
        </div>
    </div>

    <div id="alert" class="alert alert-danger d-none" role="alert">
        <p id="alertText"></p>
    </div>

    <div class="container mt-5 formularioProductoNuevo">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-12">
                <h4>Agregar nuevo producto</h4>
                <form id="productForm">
                    <div class="mb-3">
                        <label for="productName" class="form-label">Nombre del Producto</label>
                        <input type="text" class="form-control" id="productName" placeholder="Agrega el nombre del producto" required>
                    </div>

                    <div class="mb-3">
                        <label for="category" class="form-label">Categoría</label>
                        <select class="form-select" id="category" required>
                            <option value="" selected>Selecciona una categoría</option>
                            <option value="1">Niños</option>
                            <option value="2">Adolescente</option>
                            <option value="3">Adultos</option>
                            <option value="4">Principiante</option>
                            <option value="5">Intermedio</option>
                            <option value="6">Avanzado</option>
                            <option value="7">Navidad</option>
                            <option value="8">AmorAmistad</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="productDescription" class="form-label">Descripción</label>
                        <textarea class="form-control" id="productDescription" rows="3" placeholder="Min. 5 palabras, máx. 20 palabras" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="productPrice" class="form-label">Precio</label>
                        <input type="text" class="form-control" id="productPrice" placeholder="Ingresa el precio" required>
                    </div>

                    <div class="mb-3">
                        <label for="productImage" class="form-label">URL de la Imagen</label>
                        <input type="url" class="form-control" id="productImage" readonly required>
                    </div>

                    <div class="d-flex justify-content-between">
                        <button type="button" class="btn btn-primary" id="uploadBtn">Subir Imagen</button>
                    </div>
                    <div class="d-flex justify-content-between">
                        <button type="button" class="btn btn-primary" id="submitBtn">Agregar Producto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="container mt-5">
        <h4>Productos Agregados</h4>
    </div>
    <div class="table-responsive mt-5 productosGuardados" id="tablaProductos">
        <table class="table table-striped" id="productosGuardados">
            <thead>
                <tr>
                    <th>Selección</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Descripción</th>
                    <th>Precio</th>
                    <th>Imagen</th>
                </tr>
            </thead>
            <tbody id="productosTable">
            </tbody>
        </table>

        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
            <button class="btn btn-primary me-md-2" type="button" id="btnEditar">Editar</button>
            <button class="btn btn-primary" type="button" id="btnEliminar">Eliminar</button>
        </div>
    </div>

    <script src="../Header_y_footer/header_y_footer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="formulario.js"></script>
    <script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>

</body>
</html>
